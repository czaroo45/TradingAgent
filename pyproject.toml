[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagent"
version = "0.1.0"
description = "Rule-based crypto market analysis and paper trading foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ccxt>=4.4,<5"]

[project.optional-dependencies]
dev = ["pytest>=8.4,<9"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.scripts]
tradingagent = "tradingagent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"tradingagent.dashboard" = ["*.html"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tradingagent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
